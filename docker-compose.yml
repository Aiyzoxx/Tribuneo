version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: siteliquidation-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: siteliquidation
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: siteliquidation-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  backend:
    image: node:20
    command: sh -c "npm install && npx prisma generate && npm run dev"
    working_dir: /app
    container_name: siteliquidation-backend
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/siteliquidation?schema=public
      - REDIS_URL=redis://redis:6379
      - PORT=3000
      - SYNC_TOKEN=my-super-secret-token
      - OPENAI_API_KEY=sk-qVVlxscHSr5fNxcWyAdgWvteLPOEV18a5uKimfw68Xxyk7UB
      - OPENAI_BASE_URL=https://api.bluesminds.com/v1
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL:-https://tribuneo.xyz/api/auth/google/callback}
      - FRONTEND_URL=${FRONTEND_URL:-https://tribuneo.xyz}
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: siteliquidation-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: siteliquidation-cloudflared
    command: tunnel --no-autoupdate run --token eyJhIjoiMDUyZGE5YjBiMmZhNTJhY2RlNjI1NTQ3NWM2OWQ5ODYiLCJ0IjoiOTAzZmMxZTctZmM2NS00MjExLWEzNTItOWM2MWNmYzQyZTBlIiwicyI6IlptSTVPVEUyWkRZdE1tWTJOQzAwWXpGakxUazVaVE10TW1RMlltRTFOVGhsTWpVMSJ9
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  db-data:
  redis-data:
