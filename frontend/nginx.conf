server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    
    # Augmenter la taille limite du payload pour le scanner IA (images HD)
    client_max_body_size 20M;

    # Gzip pour réduire la taille des transferts
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Cache long pour les assets statiques (js/css avec hash dans le nom)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy des appels API vers le backend
    resolver 127.0.0.11 valid=30s;
    set $backend http://siteliquidation-backend:3000;

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA : toutes les routes renvoient index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
